<device-layout [device]="device()">
  <brightness-panel
    [value]="lighting().brightness"
    [applyToAll]="syncBrightness()"
    (valueChange)="onBrightnessChange($event)"
    (applyToAllChange)="onSyncBrightnessChange($event)"
  ></brightness-panel>

  <!-- The same two wave values, anticlockwise and clockwise — `razeraccessory_driver.c`. -->
  <effects-panel
    waveOrientation="rotary"
    [effect]="lighting().effect"
    [settings]="lighting().settings"
    [applyToAll]="syncEffect()"
    (effectChange)="onEffectChange($event)"
    (settingsChange)="onSettingsChange($event)"
    (applyToAllChange)="onSyncEffectChange($event)"
  ></effects-panel>

  <!--
    Third on purpose. `synMasonry` pins panel N to column N, wrapping — so the
    third lands under the first, putting the switch below the brightness it
    turns off rather than beside it. It stays there whatever the effects panel
    beside it does, which is what the masonry buys.
  -->
  <lighting-switch-off-panel></lighting-switch-off-panel>
</device-layout>
