<page-bar
  #bar
  [descriptor]="descriptor"
  [selected]="section()"
  (selectedChange)="rememberSection($event)"
  ariaLabel="Mousemat sections"
></page-bar>

<div
  role="tabpanel"
  [id]="bar.activePanelId()"
  [attr.aria-labelledby]="bar.activeTabId()"
>
  <ng-container
    *ngComponentOutlet="bar.activeItem().component; inputs: sectionInputs()"
  ></ng-container>
</div>
