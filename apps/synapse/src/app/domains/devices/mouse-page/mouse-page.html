<page-bar #bar [descriptor]="descriptor" ariaLabel="Mouse sections">
  <!--
    Nothing when the device has no battery to report — which is also what a
    wired mouse will look like once this is read from the device rather than
    stood in for.
  -->
  @if (battery(); as charge) {
    <syn-battery
      [level]="charge.level"
      [charging]="charge.charging"
    ></syn-battery>
  }
</page-bar>

<!--
  Closes the tabs pattern: the bar owns the tab ids and the selection, the page
  owns the panel. Without these the tabs' aria-controls point at nothing.
-->
<div
  role="tabpanel"
  [id]="bar.activePanelId()"
  [attr.aria-labelledby]="bar.activeTabId()"
>
  <ng-container
    *ngComponentOutlet="bar.activeItem().component; inputs: sectionInputs()"
  ></ng-container>
</div>
