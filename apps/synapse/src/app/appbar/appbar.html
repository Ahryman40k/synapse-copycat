<div class="bar__entries" #entries>
  <razer-logo></razer-logo>

  <!--
  The fixed places — the dashboard and the two workspaces. Driven from a table
  rather than written out, so adding a page is a line there and not four edits
  spread across this file, the component, the routes and the navigation.

  aria-current="page" is set only on the current one — that is what tells a
  screen-reader user where they are, and what the theme file selects on to
  recolour the label.
-->
  @for (entry of places; track entry.place) {
    <button
      navbar
      type="button"
      [attr.aria-current]="entry.place === place() ? 'page' : null"
      (click)="placeRequested.emit(entry.place)"
    >
      {{ entry.label }}
    </button>
  }

  <div class="spacer"></div>
</div>

<!--
  Outside `.bar__entries` because that region is clipped, and the settings entry
  must never be the thing that scrolls out.

  The gear is drawn here rather than pulled from an asset so it can take the
  theme colour — an `<img>` is an isolated document no rule of ours reaches.
-->
<button
  navbar
  type="button"
  class="settings"
  title="Settings"
  aria-label="Settings"
  [attr.aria-current]="place() === 'settings' ? 'page' : null"
  (click)="placeRequested.emit(settings.place)"
>
  <svg
    class="settings__icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="3" />
    <path
      d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
    />

</button>
