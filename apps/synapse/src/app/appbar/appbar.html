<!--
  Only this part is clipped. The overflow menu lives outside it: an
  `overflow: hidden` ancestor also clips absolutely positioned descendants, so
  a menu rendered inside here was in the DOM and invisible.
-->
<div class="bar__entries" #entries>
  <razer-logo></razer-logo>

  <!--
  The fixed places — the dashboard and the two workspaces. Driven from a table
  rather than written out, so adding a page is a line there and not four edits
  spread across this file, the component, the routes and the navigation.

  aria-current="page" is set only on the current one — that is what tells a
  screen-reader user where they are, and what the theme file selects on to
  recolour the label.
-->
  @for (entry of places; track entry.place) {
    <button
      navbar
      type="button"
      [attr.aria-current]="entry.place === place() ? 'page' : null"
      (click)="placeRequested.emit(entry.place)"
    >
      {{ entry.label }}
    </button>
  }

  <!--
  Labelled by kind, numbered only where a kind repeats — short enough for a
  narrow window. The full name is the `title`, never an aria-label overriding
  the visible text: WCAG 2.5.3 (Label in Name) requires the accessible name to
  contain what is written on the control, or voice control stops matching it.

  `hidden` on the clipped ones takes them out of the tab order and the
  accessibility tree; the stylesheet keeps their box, so the layout — and
  therefore what fits — never changes as a result.
-->
  @for (entry of moduleEntries(); track entry.item.kind) {
    <button
      #entryButton
      navbar
      type="button"
      [attr.data-entry-id]="entry.item.kind"
      [hidden]="overflowing().has(entry.item.kind)"
      [title]="entry.item.name"
      [attr.aria-current]="entry.item.kind === activeId() ? 'page' : null"
      (click)="activateModule(entry.item)"
    >
      {{ entry.label }}
    </button>
  }

  <div class="spacer"></div>
</div>

<!--
  The slot is always in the layout, the trigger only shown when it has
  something to offer. Reserving the width keeps what fits from changing as the
  trigger appears.
-->
<div class="overflow" [class.overflow--empty]="!hasOverflow()">
  @if (hasOverflow()) {
    <button
      navbar
      type="button"
      class="overflow__trigger"
      aria-haspopup="menu"
      [attr.aria-expanded]="overflowOpen()"
      [attr.aria-label]="hiddenEntries().length + ' more'"
      (click)="toggleOverflow()"
    >
      ⋯
    </button>

    @if (overflowOpen()) {
      <!--
        Closes on selection and on Escape, which is bound on the host so it
        works wherever the focus sits inside the bar.
      -->
      <div class="overflow__menu" role="menu">
        @for (entry of hiddenEntries(); track entry.item.kind) {
          <button
            type="button"
            role="menuitem"
            class="overflow__item"
            [title]="entry.item.name"
            [attr.aria-current]="entry.item.kind === activeId() ? 'page' : null"
            (click)="activateFromMenu(entry.item)"
          >
            {{ entry.label }}
          </button>
        }
      </div>
    }
  }
</div>

<!--
  Outside `.bar__entries` for the same reason as the overflow menu: that region
  is clipped, and the settings entry must never be the thing that scrolls out.

  The gear is drawn here rather than pulled from an asset so it can take the
  theme colour — an `<img>` is an isolated document no rule of ours reaches.
-->
<button
  navbar
  type="button"
  class="settings"
  title="Settings"
  aria-label="Settings"
  [attr.aria-current]="place() === 'settings' ? 'page' : null"
  (click)="placeRequested.emit(settings.place)"
>
  <svg
    class="settings__icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="3" />
    <path
      d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
    />
  </svg>
</button>
