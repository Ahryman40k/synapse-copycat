<syn-panel>
  <h2>Effects</h2>

  <syn-select
    ariaLabel="Lighting effect"
    [options]="effects"
    [value]="effect()"
    (valueChange)="onEffectChange($event)"
  ></syn-select>

  <!--
    Ticked, the choice above stops belonging to this device: it is made for
    every one of them, and stays that way until it is unticked.
  -->
  <syn-checkbox
    [checked]="applyToAll()"
    (checkedChange)="applyToAll.set($event)"
  >
    Apply to all devices
  </syn-checkbox>
</syn-panel>
