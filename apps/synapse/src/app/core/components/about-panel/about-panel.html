<syn-panel>
  <h2>About</h2>

  <p class="about-panel__caption">A Linux replacement for Razer Synapse.</p>

  <!--
    A real link, not a button that navigates: it is an address, so it should be
    copyable, openable in a new tab, and readable by a screen reader as a link.
    The mark is drawn inline so it takes the theme colour.
  -->
  <a
    class="about-panel__link"
    [href]="projectUrl"
    target="_blank"
    rel="noreferrer noopener"
  >
    <svg
      class="about-panel__icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path
        d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
      />
    </svg>
    <span>Ahryman40k/synapse-copycat</span>
  </a>

  @if (version(); as shown) {
    <p class="about-panel__caption">Version {{ shown }}</p>
  }
</syn-panel>
