[package]
name = "openrazer"
version = "0.1.0"
description = "Talk to the OpenRazer daemon — DBus on Linux, its REST bridge on Windows"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
# The hotplug channel: the subscription hands back an mpsc receiver and a
# spawned task feeds it. Already in the tree through zbus and Tauri.
tokio = { workspace = true }

# Linux only
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.12.0", features = ["tokio"] }
# `StreamExt::next` on zbus's signal streams, nothing more.
futures = { version = "0.3", default-features = false, features = ["std"] }
# Reading the introspection XML for capability discovery. Already in the tree
# through zbus, which parses the same documents to build its proxies.
quick-xml = "0.41.0"

# Windows only
[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { version = "0.12", features = ["json"] }
