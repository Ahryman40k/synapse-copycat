@if (showBubble()) {
  <div
    #bubble
    class="syn-slider__bubble"
    [style.left.px]="bubbleLeft()"
    aria-hidden="true"
  >
    {{ value() }}
  </div>
}

<input
  #inputRange
  class="syn-slider__input"
  type="range"
  [min]="min()"
  [max]="max()"
  [step]="step()"
  [value]="value()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  (input)="onInput($event)"
/>

<div class="syn-slider__scale" aria-hidden="true">
  <span>{{ minLabel() ?? min() }}</span>
  <span>{{ maxLabel() ?? max() }}</span>
</div>
