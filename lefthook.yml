# Two formatters with strictly disjoint scopes — see .prettierignore.
# `nx format` is hardcoded to Prettier and cannot be pointed at Biome, so the
# split is enforced by ignore files rather than by configuration.
pre-commit:
  parallel: true
  commands:
    format-code:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc}'
      run: pnpm exec biome format --write {staged_files}
      stage_fixed: true

    format-markup:
      glob: '*.{scss,css,html,md,mdx,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    lint:
      run: pnpm nx run-many -t lint --outputStyle=stream

    test:
      run: pnpm nx run-many -t test --outputStyle=stream

    build:
      run: pnpm nx run-many -t build --outputStyle=stream

# Every story's `play`, in a real Chromium. It catches what jsdom structurally
# cannot: computed styles, view transitions, and change detection that is not
# synchronous — it found an unhandled promise rejection in the page bar the
# first time it ran.
#
# On push rather than on commit: it builds Storybook and drives a browser, so
# it takes about thirty seconds against five for everything else. That is worth
# paying once before the work leaves the machine, not on every commit of a
# session.
pre-push:
  commands:
    test-storybook:
      run: pnpm nx run synapse:test-storybook --outputStyle=stream
