pre-commit:
  parallel: true
  commands:
    # affected:
    #   run: pnpm nx show projects --affected

    # format:
    #   run: pnpm nx format:write --files {staged_files}
    #   stage_fixed: true

    lint:
      run: pnpm nx run-many -t lint --outputStyle=stream --files {staged_files}
      stage_fixed: true

    test:
      run: pnpm nx run-many -t test --parallel=1 --outputStyle=stream --files {staged_files}
      stage_fixed: true

    build:
      run: pnpm nx run-many -t build --parallel=1 --outputStyle=stream --staged_files {staged_files}
      stage_fixed: true
