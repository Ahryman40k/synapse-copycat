pre-commit:
  parallel: true
  commands:
    # affected:
    #   run: pnpm nx show projects --affected

    # format:
    #   run: pnpm nx format:write --files {staged_files}
    #   stage_fixed: true

    lint:
      run: pnpm nx run-many -t lint --outputStyle=stream

    test:
      run: pnpm nx run-many -t test --parallel=1 --outputStyle=stream

    build:
      run: pnpm nx run-many -t build --parallel=1 --outputStyle=stream

pre-push:
  commands:
    git-lfs:
      run: |
        command -v git-lfs >/dev/null 2>&1 || { echo >&2 "\nThis repository is configured for Git LFS but 'git-lfs' was not found on your path. If you no longer wish to use Git LFS, remove this hook by deleting the 'pre-push' file in the hooks directory (set by 'core.hookspath'; usually '.git/hooks').\n"; exit 2; }
        git lfs pre-push "$@"

post-merge:
  commands:
    git-lfs:
      run: |
        command -v git-lfs >/dev/null 2>&1 || { echo >&2 "\nThis repository is configured for Git LFS but 'git-lfs' was not found on your path. If you no longer wish to use Git LFS, remove this hook by deleting the 'post-merge' file in the hooks directory (set by 'core.hookspath'; usually '.git/hooks').\n"; exit 2; }
        git lfs post-merge "$@"

post-commit:
  commands:
    git-lfs:
      run: |
        command -v git-lfs >/dev/null 2>&1 || { echo >&2 "\nThis repository is configured for Git LFS but 'git-lfs' was not found on your path. If you no longer wish to use Git LFS, remove this hook by deleting the 'post-commit' file in the hooks directory (set by 'core.hookspath'; usually '.git/hooks').\n"; exit 2; }
        git lfs post-commit "$@"

